name: Prod release to stores

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to release
        required: true
        type: choice
        options: [ ios, android, both ]
      run_id:
        description: "Build run id (default: latest completed run that has the required artifact)"
        required: false
        type: string

# actions: read is required to download artifacts from the build run.
permissions:
  actions: read
  contents: read

concurrency:
  group: release-to-stores
  cancel-in-progress: false

jobs:
  resolve-build:
    name: Resolve build run
    uses: ./.github/workflows/resolve-build.yml
    with:
      platform: ${{ inputs.platform }}
      run_id: ${{ inputs.run_id }}

  release-android:
    name: Android → Google Play (production)
    needs: resolve-build
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download Android AAB
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mergen-android-aab
          path: artifacts
          run-id: ${{ needs.resolve-build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Upload to Google Play (production)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: hu.petrik.filcapp
          releaseFiles: artifacts/Mergen.aab
          tracks: production
          status: completed

  release-ios:
    name: iOS → App Store
    needs: resolve-build
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download iOS IPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mergen-ios-ipa
          path: artifacts
          run-id: ${{ needs.resolve-build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Set up tools (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: ruby

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('Gemfile.lock') }}
          restore-keys: ${{ runner.os }}-gems-

      - name: Install fastlane
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "${RUNNER_TEMP}/asc"
          printf '%s' "${ASC_KEY_P8}" > "${RUNNER_TEMP}/asc/AuthKey.p8"
          chmod 600 "${RUNNER_TEMP}/asc/AuthKey.p8"

      - name: Upload to App Store
        env:
          IPA_PATH: artifacts/Mergen.ipa
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          bundle exec fastlane ios release
