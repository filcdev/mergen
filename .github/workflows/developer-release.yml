name: Developer Release

on:
  workflow_dispatch:
    inputs:
      build_play_aab:
        description: Build signed Google Play AAB
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: developer-release
  cancel-in-progress: false

env:
  DEV_TAG: dev-latest
  ANDROID_VERSION_NAME: 1.0.0-dev.${{ github.run_number }}
  PLAY_VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  android:
    name: Android APK + Google Play AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Android developer APK
        run: |
          ./gradlew :composeApp:assembleDebug \
            -PmergenVersionCode="${{ github.run_number }}" \
            -PmergenVersionName="${ANDROID_VERSION_NAME}"

      - name: Prepare Android APK
        run: |
          mkdir -p release-assets
          cp composeApp/build/outputs/apk/debug/composeApp-debug.apk \
            release-assets/Mergen-android-dev.apk

      - name: Validate Google Play signing secrets
        if: ${{ inputs.build_play_aab }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=0

          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::Missing GitHub secret: ANDROID_UPLOAD_KEYSTORE_BASE64"
            missing=1
          fi

          if [[ -z "${STORE_PASSWORD}" ]]; then
            echo "::error::Missing GitHub secret: ANDROID_UPLOAD_STORE_PASSWORD"
            missing=1
          fi

          if [[ -z "${KEY_ALIAS}" ]]; then
            echo "::error::Missing GitHub secret: ANDROID_UPLOAD_KEY_ALIAS"
            missing=1
          fi

          if [[ -z "${KEY_PASSWORD}" ]]; then
            echo "::error::Missing GitHub secret: ANDROID_UPLOAD_KEY_PASSWORD"
            missing=1
          fi

          if [[ "${missing}" -ne 0 ]]; then
            echo
            echo "Configure the Android upload-key secrets before building a Play AAB."
            exit 1
          fi

      - name: Restore Android upload keystore
        if: ${{ inputs.build_play_aab }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/mergen-upload.jks"

          if [[ ! -s "${RUNNER_TEMP}/mergen-upload.jks" ]]; then
            echo "::error::Decoded upload keystore is empty."
            exit 1
          fi

      - name: Build Google Play release AAB
        if: ${{ inputs.build_play_aab }}
        run: |
          ./gradlew :composeApp:bundleRelease \
            -PmergenVersionCode="${{ github.run_number }}" \
            -PmergenVersionName="${PLAY_VERSION_NAME}"

      - name: Sign Google Play AAB
        if: ${{ inputs.build_play_aab }}
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          AAB="composeApp/build/outputs/bundle/release/composeApp-release.aab"
          KEYSTORE="${RUNNER_TEMP}/mergen-upload.jks"

          if [[ ! -f "${AAB}" ]]; then
            echo "::error::Release AAB was not created: ${AAB}"
            exit 1
          fi

          jarsigner \
            -keystore "${KEYSTORE}" \
            -storepass "${STORE_PASSWORD}" \
            -keypass "${KEY_PASSWORD}" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "${AAB}" \
            "${KEY_ALIAS}"

          jarsigner -verify "${AAB}"

          cp "${AAB}" release-assets/Mergen-android-play.aab

      - name: Verify Android signing certificate
        if: ${{ inputs.build_play_aab }}
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          # Play-registered upload certificate SHA1. If the upload key is reset/changed,
          # set the repository variable ANDROID_UPLOAD_CERT_SHA1 to the new fingerprint.
          EXPECTED_SHA1: ${{ vars.ANDROID_UPLOAD_CERT_SHA1 || '39:35:C6:D0:89:3D:2D:AE:67:7F:E3:6A:77:7F:A8:48:E5:6E:DF:C0' }}
        run: |
          set -euo pipefail
          norm() { tr -d '[:space:]' | tr 'a-f' 'A-F'; }
          fpr() { grep -m1 -E 'SHA-?1:' | sed -E 's/.*SHA-?1:[[:space:]]*//'; }

          keystore_fpr="$(keytool -list -v -keystore "${RUNNER_TEMP}/mergen-upload.jks" \
            -storepass "${STORE_PASSWORD}" -alias "${KEY_ALIAS}" | fpr | norm)"
          aab_fpr="$(keytool -printcert -jarfile release-assets/Mergen-android-play.aab | fpr | norm)"
          expected="$(printf '%s' "${EXPECTED_SHA1}" | norm)"

          echo "Upload keystore SHA1: ${keystore_fpr}"
          echo "Signed AAB SHA1:      ${aab_fpr}"
          echo "Expected (Play):      ${expected}"

          if [[ "${keystore_fpr}" != "${expected}" || "${aab_fpr}" != "${expected}" ]]; then
            echo "::error::Android signing certificate mismatch - Google Play will reject this AAB."
            echo "::error::Sign with the keystore registered as the Play upload key (update the ANDROID_UPLOAD_* secrets), or reset the upload key in Play Console -> App integrity and set the repository variable ANDROID_UPLOAD_CERT_SHA1 to the new fingerprint."
            exit 1
          fi
          echo "OK: AAB is signed with the Play-registered upload certificate."

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mergen-android-apk
          path: release-assets/Mergen-android-dev.apk
          if-no-files-found: error

      - name: Upload Google Play AAB artifact
        if: ${{ inputs.build_play_aab }}
        uses: actions/upload-artifact@v4
        with:
          name: mergen-android-play-aab
          path: release-assets/Mergen-android-play.aab
          if-no-files-found: error

  ios-simulator:
    name: iOS Simulator
    runs-on: macos-15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build iOS Simulator app
        run: |
          rm -rf build/ios-simulator
          mkdir -p build/ios-simulator

          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="hu.petrik.filcapp.Filcapp" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="1.0.0" \
            CONFIGURATION_BUILD_DIR="$PWD/build/ios-simulator" \
            build

      - name: Package iOS Simulator app
        run: |
          APP_PATH="$(find build/ios-simulator -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [[ -z "$APP_PATH" ]]; then
            echo "No .app was produced."
            exit 1
          fi

          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            release-assets/Mergen-ios-simulator.zip

      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: mergen-ios-simulator
          path: release-assets/Mergen-ios-simulator.zip
          if-no-files-found: error

  publish:
    name: Publish dev-latest
    runs-on: ubuntu-latest
    needs:
      - android
      - ios-simulator
    if: ${{ always() && needs.android.result == 'success' }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mergen-*
          path: release-assets
          merge-multiple: true

      - name: Create release notes
        env:
          IOS_RESULT: ${{ needs.ios-simulator.result }}
          PLAY_AAB: ${{ inputs.build_play_aab }}
        run: |
          cat > release-notes.md <<EOF
          ## Mergen – latest developer build

          This release is generated by GitHub Actions from the latest selected commit.

          - Commit: \`${GITHUB_SHA}\`
          - Workflow run: \`${GITHUB_RUN_NUMBER}\`
          - Android APK: ready
          - Google Play AAB requested: \`${PLAY_AAB}\`
          - iOS Simulator job: \`${IOS_RESULT}\`

          ### Android testing

          Download **Mergen-android-dev.apk** and install it directly on an Android device.

          ### Google Play

          Download **Mergen-android-play.aab** and upload it to Google Play Console.
          The AAB is a release build signed with the configured Android upload key.

          ### iOS

          If **Mergen-ios-simulator.zip** is attached, it is intended for developers
          using the iOS Simulator on macOS.

          A Simulator build cannot be installed on a physical iPhone.
          EOF

      - name: Replace moving developer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${DEV_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --cleanup-tag \
            --yes 2>/dev/null || true

          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${DEV_TAG}" \
            >/dev/null 2>&1 || true

          gh release create "${DEV_TAG}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Mergen – latest developer build" \
            --prerelease \
            --notes-file release-notes.md

      - name: Summary
        env:
          PLAY_AAB: ${{ inputs.build_play_aab }}
        run: |
          {
            echo "## Developer release published"
            echo
            echo "Release:"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${DEV_TAG}"
            echo
            echo "Android APK:"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${DEV_TAG}/Mergen-android-dev.apk"

            if [[ "${PLAY_AAB}" == "true" ]]; then
              echo
              echo "Google Play AAB:"
              echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${DEV_TAG}/Mergen-android-play.aab"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
