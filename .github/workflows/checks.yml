name: Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tools come from mise.toml; android-sdk stays out so the runner's
      # preinstalled Android SDK (and its ANDROID_HOME) is used.
      - name: Set up tools (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: java gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # v6 defaults to Gradle's proprietary cache service; keep the old
          # actions/cache-based behavior.
          cache-provider: basic

      - name: Compile
        run: gradle :composeApp:compileDebugKotlinAndroid

      - name: Unit tests
        run: gradle :composeApp:testDebugUnitTest

      - name: Android Lint
        run: gradle :composeApp:lintDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore
