name: Kotlin Linting (CLI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint_only:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tools come from mise.toml (source of truth). Only java and ktlint are
      # installed here; android-sdk stays out of CI because Gradle builds use
      # the runner's preinstalled Android SDK.
      - name: Set up tools (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: java ktlint

      - name: Execute Ktlint Check
        run: ktlint "**/*.kt" "**/*.kts" "!**/build/**" "!composeApp/src/commonMain/kotlin/hu/petrik/filcapp/api/**"
