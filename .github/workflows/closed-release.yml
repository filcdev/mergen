name: Closed release to stores

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to release
        required: true
        type: choice
        options: [ android, ios, both ]
      run_id:
        description: "Optional iOS release-build run ID; Android always builds a fresh AAB."
        required: false
        type: string

permissions:
  actions: read
  contents: read

# Shared with prod-release.yml so a production rollout and a closed-test
# upload cannot publish the same Play version simultaneously.
concurrency:
  group: release-to-stores
  cancel-in-progress: false

jobs:
  # iOS still publishes a previously signed IPA; Android never reuploads
  # a historical AAB, which Google Play rejects once its code was used.
  resolve-build:
    name: Resolve iOS build run
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    uses: ./.github/workflows/resolve-build.yml
    with:
      platform: ios
      run_id: ${{ inputs.run_id }}

  release-android:
    name: Android → fresh signed AAB → Google Play (closed testing)
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MERGEN_FCM_APP_ID: ${{ vars.MERGEN_FCM_APP_ID || secrets.MERGEN_FCM_APP_ID }}
      MERGEN_FCM_SENDER_ID: ${{ vars.MERGEN_FCM_SENDER_ID || secrets.MERGEN_FCM_SENDER_ID }}
      MERGEN_FCM_API_KEY: ${{ vars.MERGEN_FCM_API_KEY || secrets.MERGEN_FCM_API_KEY }}
      MERGEN_FCM_PROJECT_ID: ${{ vars.MERGEN_FCM_PROJECT_ID || secrets.MERGEN_FCM_PROJECT_ID }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up tools (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: java gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Check Google Play credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo '::error::Missing repository secret PLAY_SERVICE_ACCOUNT_JSON'
            exit 1
          fi

      - name: Resolve next Android version from Google Play and Git tags
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GH_TOKEN: ${{ github.token }}
          PLAY_PACKAGE_NAME: hu.petrik.filcapp
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/play-version-venv"
          "${RUNNER_TEMP}/play-version-venv/bin/pip" install --disable-pip-version-check --quiet google-auth requests
          "${RUNNER_TEMP}/play-version-venv/bin/python" .github/scripts/resolve_play_version.py

      - name: Verify Android release configuration
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          MERGEN_RELEASE_ENTRA_CLIENT_ID: ${{ secrets.MERGEN_RELEASE_ENTRA_CLIENT_ID || vars.MERGEN_RELEASE_ENTRA_CLIENT_ID }}
          MERGEN_RELEASE_ENTRA_TENANT_ID: ${{ secrets.MERGEN_RELEASE_ENTRA_TENANT_ID || vars.MERGEN_RELEASE_ENTRA_TENANT_ID }}
        run: |
          set -euo pipefail
          for var in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD MERGEN_RELEASE_ENTRA_CLIENT_ID MERGEN_RELEASE_ENTRA_TENANT_ID MERGEN_FCM_APP_ID MERGEN_FCM_SENDER_ID MERGEN_FCM_API_KEY MERGEN_FCM_PROJECT_ID; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Missing Android release configuration: $var (GitHub repository secret or variable)"
              exit 1
            fi
          done

      - name: Decode Android upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/mergen-upload.jks"
          chmod 600 "${RUNNER_TEMP}/mergen-upload.jks"
          test -s "${RUNNER_TEMP}/mergen-upload.jks"

      - name: Build fresh signed Android App Bundle
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          MERGEN_RELEASE_ENTRA_CLIENT_ID: ${{ secrets.MERGEN_RELEASE_ENTRA_CLIENT_ID || vars.MERGEN_RELEASE_ENTRA_CLIENT_ID }}
          MERGEN_RELEASE_ENTRA_TENANT_ID: ${{ secrets.MERGEN_RELEASE_ENTRA_TENANT_ID || vars.MERGEN_RELEASE_ENTRA_TENANT_ID }}
        run: |
          set -euo pipefail
          gradle :composeApp:bundleRelease \
            -PmergenVersionCode="$VERSION_CODE" \
            -PmergenVersionName="$VERSION" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/mergen-upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_UPLOAD_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_UPLOAD_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_UPLOAD_KEY_PASSWORD"
          mkdir -p artifacts
          cp composeApp/build/outputs/bundle/release/composeApp-release.aab artifacts/Mergen.aab
          test -s artifacts/Mergen.aab

      - name: Verify Google Play upload certificate
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          EXPECTED_SHA1: ${{ vars.ANDROID_UPLOAD_CERT_SHA1 || '39:35:C6:D0:89:3D:2D:AE:67:7F:E3:6A:77:7F:A8:48:E5:6E:DF:C0' }}
        run: |
          set -euo pipefail
          norm() { tr -d '[:space:]' | tr 'a-f' 'A-F'; }
          fpr() { grep -m1 -E 'SHA-?1:' | sed -E 's/.*SHA-?1:[[:space:]]*//'; }
          keystore_fpr="$(keytool -list -v -keystore "${RUNNER_TEMP}/mergen-upload.jks" \
            -storepass "$ANDROID_UPLOAD_STORE_PASSWORD" -alias "$ANDROID_UPLOAD_KEY_ALIAS" | fpr | norm)"
          aab_fpr="$(keytool -printcert -jarfile artifacts/Mergen.aab | fpr | norm)"
          expected="$(printf '%s' "$EXPECTED_SHA1" | norm)"
          if [[ "$keystore_fpr" != "$expected" || "$aab_fpr" != "$expected" ]]; then
            echo '::error::Signed AAB does not match the Play-registered upload certificate'
            exit 1
          fi
          echo 'Signed AAB upload certificate matches Play.'

      - name: Save signed AAB artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mergen-android-aab
          path: artifacts/Mergen.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload new AAB to Google Play (closed testing)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: hu.petrik.filcapp
          releaseFiles: artifacts/Mergen.aab
          tracks: alpha
          status: completed

  release-ios:
    name: iOS → TestFlight
    needs: resolve-build
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download iOS IPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mergen-ios-ipa
          path: artifacts
          run-id: ${{ needs.resolve-build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Set up tools (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: ruby

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('Gemfile.lock') }}
          restore-keys: ${{ runner.os }}-gems-

      - name: Install fastlane
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "${RUNNER_TEMP}/asc"
          printf '%s' "$ASC_KEY_P8" > "${RUNNER_TEMP}/asc/AuthKey.p8"
          chmod 600 "${RUNNER_TEMP}/asc/AuthKey.p8"

      - name: Upload to TestFlight
        env:
          IPA_PATH: artifacts/Mergen.ipa
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          bundle exec fastlane ios upload
