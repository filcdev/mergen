name: Dependency Submission (Gradle)

on:
  push:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  submit-gradle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tools come from mise.toml (source of truth). With no Gradle wrapper
      # checked in, the submission action uses the `gradle` on PATH.
      - name: Set up tools (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: java gradle

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # v6 defaults to Gradle's proprietary cache service; keep the old
          # actions/cache-based behavior.
          cache-provider: basic
