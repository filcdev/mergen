name: Release build

on:
  release:
    types: [ published ]
  workflow_dispatch:
    # manual build; produces signed artifacts, no store upload (attaches the APK if the tag has a release)
    inputs:
      tag:
        description: Git tag to build (e.g. v1.2.3).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: iOS → signed IPA + release asset
    permissions:
      contents: write
    if: ${{ !github.event.release.prerelease }}
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      # Tools come from mise.toml; android-sdk stays out so the runner's
      # preinstalled Android SDK (and its ANDROID_HOME) is used.
      - name: Set up tools (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: java gradle ruby

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # v6 defaults to Gradle's proprietary cache service; keep the old
          # actions/cache-based behavior.
          cache-provider: basic

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('Gemfile.lock') }}
          restore-keys: ${{ runner.os }}-gems-

      - name: Install fastlane
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Resolve version
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          [[ "$RAW_TAG" =~ ^v?[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || { echo "::error::invalid release tag: $RAW_TAG (must be v?MAJOR.MINOR.PATCH, each component 0-999)"; exit 1; }
          echo "VERSION=${RAW_TAG#v}" >> "$GITHUB_ENV"
          echo "Resolved version: ${RAW_TAG#v}"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "${RUNNER_TEMP}/asc"
          printf '%s' "${ASC_KEY_P8}" > "${RUNNER_TEMP}/asc/AuthKey.p8"
          chmod 600 "${RUNNER_TEMP}/asc/AuthKey.p8"

      - name: Build signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          bundle exec fastlane ios build

      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mergen-ios-ipa
          path: artifacts/Mergen.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          if gh release view "$RAW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RAW_TAG" artifacts/Mergen.ipa \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "No GitHub release for $RAW_TAG; skipping asset upload (IPA is still a workflow artifact)."
          fi

  build-android:
    name: Android → signed AAB + APK artifact
    permissions:
      contents: write
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      # Tools come from mise.toml; android-sdk stays out so the runner's
      # preinstalled Android SDK (and its ANDROID_HOME) is used.
      - name: Set up tools (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: java gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # v6 defaults to Gradle's proprietary cache service; keep the old
          # actions/cache-based behavior.
          cache-provider: basic

      - name: Resolve version
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          [[ "$RAW_TAG" =~ ^v?[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || { echo "::error::invalid release tag: $RAW_TAG (must be v?MAJOR.MINOR.PATCH, each component 0-999)"; exit 1; }
          VERSION="${RAW_TAG#v}"
          IFS=. read -r MAJ MIN PAT <<< "$VERSION"
          VERSION_CODE=$((10#$MAJ * 1000000 + 10#$MIN * 1000 + 10#$PAT))
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "Resolved version: ${VERSION} (versionCode ${VERSION_CODE})"

      - name: Decode Android upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/mergen-upload.jks"
          chmod 600 "${RUNNER_TEMP}/mergen-upload.jks"
          if [[ ! -s "${RUNNER_TEMP}/mergen-upload.jks" ]]; then
            echo "::error::Decoded upload keystore is empty."
            exit 1
          fi

      - name: Build signed AAB + APK
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          [[ -n "$ANDROID_UPLOAD_STORE_PASSWORD" && -n "$ANDROID_UPLOAD_KEY_ALIAS" && -n "$ANDROID_UPLOAD_KEY_PASSWORD" ]] || { echo "::error::Missing Android signing secret(s)"; exit 1; }
          gradle :composeApp:bundleRelease :composeApp:assembleRelease \
            -PmergenVersionCode="$VERSION_CODE" \
            -PmergenVersionName="$VERSION" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/mergen-upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_UPLOAD_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_UPLOAD_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_UPLOAD_KEY_PASSWORD"

      - name: Copy AAB + APK to artifacts
        run: |
          mkdir -p artifacts
          cp composeApp/build/outputs/bundle/release/composeApp-release.aab artifacts/Mergen.aab
          APK_DIR="composeApp/build/outputs/apk/release"
          APK="$(find "$APK_DIR" -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' -print -quit)"
          [[ -n "$APK" ]] || { echo "::error::No signed release APK found in $APK_DIR."; exit 1; }
          cp "$APK" artifacts/Mergen.apk

      - name: Verify Android signing certificate
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          # Play-registered upload certificate SHA1. If the upload key is reset/changed,
          # set the repository variable ANDROID_UPLOAD_CERT_SHA1 to the new fingerprint.
          EXPECTED_SHA1: ${{ vars.ANDROID_UPLOAD_CERT_SHA1 || '39:35:C6:D0:89:3D:2D:AE:67:7F:E3:6A:77:7F:A8:48:E5:6E:DF:C0' }}
        run: |
          set -euo pipefail
          norm() { tr -d '[:space:]' | tr 'a-f' 'A-F'; }
          fpr() { grep -m1 -E 'SHA-?1:' | sed -E 's/.*SHA-?1:[[:space:]]*//'; }

          keystore_fpr="$(keytool -list -v -keystore "${RUNNER_TEMP}/mergen-upload.jks" \
            -storepass "${ANDROID_UPLOAD_STORE_PASSWORD}" -alias "${ANDROID_UPLOAD_KEY_ALIAS}" | fpr | norm)"
          aab_fpr="$(keytool -printcert -jarfile artifacts/Mergen.aab | fpr | norm)"
          expected="$(printf '%s' "${EXPECTED_SHA1}" | norm)"

          echo "Upload keystore SHA1: ${keystore_fpr}"
          echo "Signed AAB SHA1:      ${aab_fpr}"
          echo "Expected (Play):      ${expected}"

          if [[ "${keystore_fpr}" != "${expected}" || "${aab_fpr}" != "${expected}" ]]; then
            echo "::error::Android signing certificate mismatch - Google Play will reject this AAB."
            echo "::error::Sign with the keystore registered as the Play upload key (update the ANDROID_UPLOAD_* secrets), or reset the upload key in Play Console -> App integrity and set the repository variable ANDROID_UPLOAD_CERT_SHA1 to the new fingerprint."
            exit 1
          fi
          echo "OK: AAB is signed with the Play-registered upload certificate."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mergen-android-aab
          path: artifacts/Mergen.aab
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mergen-android-apk
          path: artifacts/Mergen.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          if gh release view "$RAW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RAW_TAG" artifacts/Mergen.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "No GitHub release for $RAW_TAG; skipping asset upload (APK is still a workflow artifact)."
          fi
